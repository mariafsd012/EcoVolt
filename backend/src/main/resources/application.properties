spring.application.name=backend


# configurando BD (aceita variáveis de ambiente para uso em container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecovolt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}

spring.jackson.time-zone=America/Fortaleza
spring.jpa.properties.hibernate.jdbc.time_zone=America/Fortaleza
#fuso horario correto

# jpa / hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# porta do servidor (padrão 8000, pode ser sobrescrita por SERVER_PORT)

server.port=${SERVER_PORT:8000}
spring.devtools.restart.enabled=false